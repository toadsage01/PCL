<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praper Contest League — Submission Form</title>

  <!-- SurveyJS Form Library v3.2.1 — MIT license, vendored locally so the
       form works offline / on flaky networks. Source: unpkg.com/survey-core
       and unpkg.com/survey-js-ui. Swap to the CDN URLs below if preferred:
         https://unpkg.com/survey-core@3.2.1/survey-core.min.css
         https://unpkg.com/survey-core@3.2.1/survey.core.min.js
         https://unpkg.com/survey-js-ui@3.2.1/survey-js-ui.min.js            -->
  <link rel="stylesheet" href="css/vendor/survey-core.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="pcl-header">
    <div class="pcl-badge" aria-hidden="true">PCL</div>
    <div class="pcl-header-text">
      <h1>Praper Contest League</h1>
      <p>Weekly submission form &middot; dual-input questions &middot; attachments up to
        <span id="pclMaxSize">…</span>&nbsp;MB</p>
    </div>
  </header>

  <main class="pcl-main">
    <div id="surveyContainer"></div>
  </main>

  <footer class="pcl-footer">
    <span id="pclMode">Mode: initializing…</span><br />
    Engine: SurveyJS Form Library (MIT) &middot; Backend: Google Apps Script &rarr; Sheets + Drive
  </footer>

  <!-- Load order matters: core → UI bindings → config → bootstrap -->
  <script src="js/vendor/survey.core.min.js"></script>
  <script src="js/vendor/survey-js-ui.min.js"></script>
  <script src="js/gas-endpoint.js"></script>
  <script src="js/survey-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
