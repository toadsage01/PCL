<!DOCTYPE html>
<html lang="en" data-pcl-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praper Contest League — Submission Form</title>

  <!-- Apply saved/system theme BEFORE first paint (no flash) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("pcl_theme");
        var sysDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-pcl-theme", saved || (sysDark ? "dark" : "light"));
      } catch (e) { /* keep light default */ }
    })();
  </script>

  <!-- SurveyJS Form Library v3.2.1 — MIT license, vendored locally so the
       form works offline / on flaky networks. Source: unpkg.com/survey-core
       and unpkg.com/survey-js-ui. Swap to the CDN URLs below if preferred:
         https://unpkg.com/survey-core@3.2.1/survey-core.min.css
         https://unpkg.com/survey-core@3.2.1/survey.core.min.js
         https://unpkg.com/survey-js-ui@3.2.1/survey-js-ui.min.js            -->
  <link rel="stylesheet" href="css/vendor/survey-core.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="pcl-header">
    <div class="pcl-badge" aria-hidden="true">
      <!-- play-triangle nod to the praper logo -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M7 4.5 19 12 7 19.5Z" fill="#ffffff" stroke="#ffffff"
              stroke-width="2.4" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="pcl-header-text">
      <h1>Praper Contest League</h1>
      <p>Weekly submission form &middot; dual-input questions &middot; attachments up to
        <span id="pclMaxSize">…</span>&nbsp;MB</p>
    </div>
    <button id="pclThemeToggle" class="pcl-toggle" type="button"
            aria-label="Toggle light / dark theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <!-- Hero: moon-ride mascot in praper colors (assets/brand/) -->
  <div class="pcl-hero">
    <img src="assets/brand/hero-moon-dino.png"
         alt="Dino riding a bicycle in front of the moon" />
  </div>

  <main class="pcl-main">
    <div id="surveyContainer"></div>
  </main>

  <footer class="pcl-footer">
    <span id="pclMode">Mode: initializing…</span><br />
    Engine: SurveyJS Form Library (MIT) &middot; Backend: Google Apps Script &rarr; Sheets + Drive
  </footer>

  <!-- Load order matters: core → UI bindings → config → bootstrap -->
  <script src="js/vendor/survey.core.min.js"></script>
  <script src="js/vendor/survey-js-ui.min.js"></script>
  <script src="js/gas-endpoint.js"></script>
  <script src="js/survey-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
