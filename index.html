<!DOCTYPE html>
<html lang="en" data-pcl-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praper Content League — Submission Terminal</title>
  <link rel="icon" type="image/png" href="assets/brand/pcl-logo-web.png" />

  <!-- Apply saved/system theme BEFORE first paint (no flash) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("pcl_theme");
        var sysDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-pcl-theme", saved || (sysDark ? "dark" : "light"));
      } catch (e) { /* keep light default */ }
    })();
  </script>

  <!-- SurveyJS Form Library v3.2.1 — MIT license, vendored locally so the
       form works offline / on flaky networks. Source: unpkg.com/survey-core
       and unpkg.com/survey-js-ui. Swap to the CDN URLs below if preferred:
         https://unpkg.com/survey-core@3.2.1/survey-core.min.css
         https://unpkg.com/survey-core@3.2.1/survey.core.min.js
         https://unpkg.com/survey-js-ui@3.2.1/survey-js-ui.min.js            -->
  <link rel="stylesheet" href="css/vendor/survey-core.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <!-- Arcade marquee: the PCL logo's native black band, both themes.
       No cover image — the theme itself carries the look. -->
  <div class="pcl-marquee">
    <header class="pcl-header">
      <img class="pcl-logo" src="assets/brand/pcl-logo-web.png"
           alt="Praper Content League" />
      <div class="pcl-marquee-divider" aria-hidden="true"></div>
      <div class="pcl-header-text">
        <p class="pcl-kicker">Season 01 &middot; Submission Terminal</p>
        <p class="pcl-insert">
          <span class="pcl-px-play" aria-hidden="true"></span>
          INSERT REEL TO CONTINUE<span class="pcl-blink" aria-hidden="true">_</span>
        </p>
      </div>
      <button id="pclThemeToggle" class="pcl-toggle" type="button"
              aria-label="Toggle light / dark theme" title="Toggle theme">
        <span class="pcl-px-icon pcl-px-sun" aria-hidden="true"></span>
        <span class="pcl-px-icon pcl-px-moon" aria-hidden="true"></span>
      </button>
    </header>
  </div>

  <main class="pcl-main">
    <div id="surveyContainer"></div>
  </main>

  <footer class="pcl-footer">
    <span id="pclMode">Mode: initializing…</span><br />
    &copy; Praper Content League &middot; <span class="pcl-footer-score">no pixels were harmed</span>
    &middot; Engine: SurveyJS (MIT) &rarr; Google Sheets + Drive
  </footer>

  <!-- Load order matters: core → UI bindings → config → bootstrap -->
  <script src="js/vendor/survey.core.min.js"></script>
  <script src="js/vendor/survey-js-ui.min.js"></script>
  <script src="js/gas-endpoint.js"></script>
  <script src="js/survey-config.js"></script>
  <script src="js/finger-slam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
